name: Sanitizers

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1
  MAKEJOBS: '-j4'
  TEST_RUNNER_PORT_MIN: 14000
  CCACHE_MAXSIZE: 300M
  CCACHE_DIR: /tmp/ccache_dir
  CCACHE_NOHASHDIR: 1

jobs:
  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SYSCOIN: Build plus both test phases exceeded three hours while
          # tests were still progressing. Run the complete native and
          # functional coverage in separate jobs with the same instrumentation.
          - name: ASan + LSan + UBSan (native)
            file_env: ./ci/test/00_setup_env_native_asan.sh
            timeout: 180
            run_unit_tests: 'true'
            run_functional_tests: 'false'
          # SYSCOIN: The full functional batch exceeded four hours even after
          # separating native tests. Partition the same enabled scripts so
          # long histories start immediately and retain all existing coverage.
          - name: ASan + LSan + UBSan (functional governance)
            file_env: ./ci/test/00_setup_env_native_asan.sh
            timeout: 240
            run_unit_tests: 'false'
            run_functional_tests: 'true'
            test_filter: '^(feature_governance|feature_governance_dynamic|feature_governance_objects)\.py'
          - name: ASan + LSan + UBSan (functional NEVM and PQ)
            file_env: ./ci/test/00_setup_env_native_asan.sh
            timeout: 240
            run_unit_tests: 'false'
            run_functional_tests: 'true'
            test_filter: '^(feature_nevm_data|feature_deterministicmns|feature_pq_operator_lifecycle|feature_pq_owner_key|feature_pq_voting_key|feature_btcheader_external_policy|rpc_mnauth|rpc_masternode)\.py'
          - name: ASan + LSan + UBSan (functional remaining)
            file_env: ./ci/test/00_setup_env_native_asan.sh
            timeout: 240
            run_unit_tests: 'false'
            run_functional_tests: 'true'
            test_filter: '^(?!(feature_governance|feature_governance_dynamic|feature_governance_objects|feature_nevm_data|feature_deterministicmns|feature_pq_operator_lifecycle|feature_pq_owner_key|feature_pq_voting_key|feature_btcheader_external_policy|rpc_mnauth|rpc_masternode)\.py)'
          - name: TSan (native)
            file_env: ./ci/test/00_setup_env_native_tsan.sh
            timeout: 180
            run_unit_tests: 'true'
            run_functional_tests: 'false'
          - name: TSan (functional)
            file_env: ./ci/test/00_setup_env_native_tsan.sh
            timeout: 180
            run_unit_tests: 'false'
            run_functional_tests: 'true'
          - name: MSan
            file_env: ./ci/test/00_setup_env_native_msan.sh
            timeout: 300
            free_disk_space: true
          - name: Fuzz smoke tests
            file_env: ./ci/test/00_setup_env_native_fuzz.sh
            timeout: 180
    env:
      FILE_ENV: ${{ matrix.file_env }}
      RUN_UNIT_TESTS: ${{ matrix.run_unit_tests }}
      RUN_FUNCTIONAL_TESTS: ${{ matrix.run_functional_tests }}
      TEST_RUNNER_FILTER: ${{ matrix.test_filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space for the instrumented LLVM build
        if: ${{ matrix.free_disk_space == true }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /

      - name: Run CI configuration
        run: ./ci/test_run_all.sh
